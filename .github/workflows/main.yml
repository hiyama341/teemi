# This workflow will install Python dependencies, run tests, build package and publish on pipy

name: ci-cd

# WIll run on push commands
on: [push]

permissions:
  contents: write

jobs:
  ci:
    # Set up operating system
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # Define job steps
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check-out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Test with pytest
        run: |
          uv run --locked --extra dev pytest tests --cov --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3

      - name: Build package
        run: uv build

      - name: pypi-publish
        # You may pin to the exact commit or the version.
        # uses: pypa/gh-action-pypi-publish@717ba43cfbb0387f6ce311b169a825772f54d295

        # we only publish a new version when there is a tag to the push,
        # and only from one matrix entry so the upload is not attempted once
        # per Python version
        if: startsWith(github.ref, 'refs/tags') && matrix.python-version == '3.11'

        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI user
          user: __token__
          # Password for your PyPI user or an access token
          password: ${{secrets.PYPI_TOKEN_TEEMI}}
          skip-existing: true
          verbose: true

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags') && matrix.python-version == '3.11'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
